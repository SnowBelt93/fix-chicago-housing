<script>
"use strict";
/* ---------- zoning rules (Chicago Zoning Ordinance, Title 17) ----------
   Residential: §17-2-0303 (lot area per home), §17-2-0304 (floor area ratio), §17-2-0311 (height).
   Business/commercial: §17-3-0402, -0403, -0408 (height with ground-floor commercial, 50–99 ft frontage).
   Downtown: floor area ratio is the number in the name; homes are estimated from floor area at 900 sq ft each. */
const CODE_R = "https://codelibrary.amlegal.com/codes/chicago/latest/chicagozoning_il/0-0-0-48908";
const CODE_B = "https://codelibrary.amlegal.com/codes/chicago/latest/chicagozoning_il/0-0-0-48935";
const RES = {
  "RS-1":{mla:6250, far:0.5, h:30, name:"Detached houses on big lots"},
  "RS-2":{mla:5000, far:0.65, h:30, name:"Detached houses"},
  "RS-3":{mla:2500, far:0.9, h:30, name:"Houses, and two-flats on some blocks"},
  "RT-3.5":{mla:1250, far:1.05, h:35, name:"Houses, two-flats and townhouses"},
  "RT-4":{mla:1000, far:1.2, h:38, name:"Two-flats, three-flats, townhouses and small apartment buildings"},
  "RT-4A":{mla:1000, far:1.2, h:38, name:"Two-flats, three-flats and small apartment buildings"},
  "RM-4.5":{mla:700, far:1.7, h:45, name:"Small apartment buildings"},
  "RM-5":{mla:400, far:2.0, h:47, name:"Apartment buildings"},
  "RM-5.5":{mla:400, far:2.5, h:47, name:"Larger apartment buildings"},
  "RM-6":{mla:300, far:4.4, h:0, name:"Mid-rise apartments"},
  "RM-6.5":{mla:300, far:6.6, h:0, name:"High-rise apartments"}};
const SUF = {"1":{mla:2500, far:1.2, h:38}, "1.5":{mla:1350, far:1.5, h:38}, "2":{mla:1000, far:2.2, h:50}, "3":{mla:400, far:3.0, h:65}, "5":{mla:200, far:5.0, h:70}};
const BC = {B1:"Neighborhood shopping street, homes upstairs", B2:"Neighborhood mixed-use, homes allowed on any floor", B3:"Community shopping district, homes upstairs",
            C1:"Neighborhood commercial, homes upstairs", C2:"Motor-vehicle commercial, homes upstairs", C3:"Commercial, no homes allowed"};
function zoneInfo(raw){
  const z = (raw || "").toUpperCase().replace(/^RM-?(\d)-?(\.5)?$/, "RM-$1$2").trim();
  if (RES[z]) return {z, fam:"R", ...RES[z], code:CODE_R, res:true};
  let m = z.match(/^(B[123]|C[123])-(1\.5|1|2|3|5)$/);
  if (m){
    const s = SUF[m[2]];
    if (m[1] === "C3") return {z, fam:"C", name:BC.C3, mla:0, far:s.far, h:s.h, code:CODE_B, nohomes:true};
    return {z, fam:"B", name:BC[m[1]], mla:s.mla, far:s.far, h:s.h, code:CODE_B, upstairs:m[1] !== "B2"};
  }
  m = z.match(/^D([XRCS])-(\d+)$/);
  if (m){
    const nm = {X:"Downtown mixed-use", R:"Downtown residential", C:"Downtown core", S:"Downtown service"}[m[1]];
    if (m[1] === "S") return {z, fam:"D", name:nm + ", no new homes", far:+m[2], h:0, nohomes:true};
    return {z, fam:"D", name:nm, far:+m[2], h:0, downtown:true};
  }
  if (/^PD/.test(z)) return {z, fam:"PD", name:"Planned development: its own ordinance sets what can be built", pd:true};
  if (/^PMD/.test(z)) return {z, fam:"M", name:"Planned manufacturing district, no homes allowed", nohomes:true};
  if (/^M[123]/.test(z)) return {z, fam:"M", name:"Manufacturing, no homes allowed", nohomes:true};
  if (/^POS/.test(z)) return {z, fam:"P", name:"Park or open space", nohomes:true};
  if (z === "T") return {z, fam:"M", name:"Transportation (rail and road land), no homes", nohomes:true};
  return {z, fam:"?", name:"Zoning not recognized", unknown:true};
}
const FAM_COLOR = {R:"#7fb6d9", B:"#b48fd1", C:"#c99ad1", D:"#2b5da0", PD:"#e0a24a", M:"#9aa3ad", P:"#8cc084", "?":"#cfd4da"};
function famColor(z){ const i = zoneInfo(z); if (i.fam === "R"){ return /^RS/.test(i.z) ? "#cfe3f1" : /^RT/.test(i.z) ? "#9fcbe8" : "#5ea2d4"; } return FAM_COLOR[i.fam]; }
/* the next step up, as people usually ask for it in a zoning change */
const UP = {"RS-1":"RT-4", "RS-2":"RT-4", "RS-3":"RT-4", "RT-3.5":"RT-4", "RT-4":"RM-5", "RT-4A":"RM-5", "RM-4.5":"RM-5", "RM-5":"RM-6", "RM-5.5":"RM-6", "RM-6":"RM-6.5"};
function upOf(i){
  if (UP[i.z]) return UP[i.z];
  if (i.fam === "B" || i.fam === "C"){ const s = i.z.split("-")[1]; return s === "3" || s === "5" ? "B2-5" : "B2-3"; }
  if (i.fam === "M") return "B2-3";
  return null;
}
function homesFor(i, lot){
  if (!i || i.nohomes || i.pd || i.unknown) return 0;
  if (i.downtown) return Math.floor(i.far * lot / 900);
  const n = Math.floor(lot / i.mla);
  return i.res ? Math.max(1, n) : n;
}
/* Assessor property classes, in plain words (Cook County Assessor's classification code) */
const CLS = {"100":"Vacant land", "190":"Vacant land", "241":"Vacant lot next to a home", "200":"Residential land", "201":"Residential garage", "202":"One-story house, small", "203":"One-story house",
  "204":"One-story house, large", "205":"Two-story house, older", "206":"Two-story house, older, larger", "207":"Two-story house", "208":"Two-story house, large", "209":"Two-story house, very large",
  "210":"Townhouse or row house", "211":"Apartment building, 2–6 homes", "212":"Mixed-use building, 6 homes or fewer", "234":"Split-level house", "278":"Two-story house, newer", "295":"Townhouse or row house",
  "299":"Condo building", "313":"Apartment building, 7+ homes", "314":"Apartment building, 7+ homes", "315":"Apartment building, 7+ homes", "318":"Mixed-use building, 7+ homes", "391":"Apartment building, 7+ homes", "396":"Apartment building, 7+ homes", "399":"Condo building",
  "517":"Commercial building", "522":"Commercial building", "523":"Commercial building", "529":"Commercial building", "530":"Commercial building", "531":"Commercial building", "590":"Commercial building", "592":"Commercial building",
  "593":"Industrial building", "597":"Commercial building", "599":"Commercial building", "EX":"Exempt from property tax (public, church, school…)", "RR":"Railroad"};
function clsName(c){ return CLS[c] || (c && c[0] === "5" ? "Commercial or industrial property" : c && c[0] === "3" ? "Apartment building, 7+ homes" : c && c[0] === "2" ? "Residential property" : "Property"); }

/* ---------- data: 0.01° tiles (tools/prep_lots.py) ---------- */
const TILES = new Map();
function tkey(lon, lat){ return [Math.floor((lon + 88) * 100), Math.floor((lat - 41) * 100)]; }
function corner(ix, iy){ return [ix / 100 - 88, iy / 100 + 41]; }
function getTile(ix, iy){
  const k = ix + "_" + iy;
  if (!TILES.has(k)) TILES.set(k, fetch("data/t/" + k + ".json").then(r => r.ok ? r.json() : null).catch(() => null).then(T => { if (T) T.k = k, T.ix = ix, T.iy = iy; return T; }));
  return TILES.get(k);
}
const KX = 111320 * Math.cos(41.85 * Math.PI / 180), KY = 110574;
async function nearest(lon, lat, maxM = 45){
  const [ix, iy] = tkey(lon, lat), want = [];
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++){
    const [x0, y0] = corner(ix + dx, iy + dy);
    if (lon - (x0 + 0.01) > 0.0007 || x0 - lon > 0.0007 || lat - (y0 + 0.01) > 0.0007 || y0 - lat > 0.0007) continue;
    want.push(getTile(ix + dx, iy + dy));
  }
  let best = null, bd = maxM;
  for (const T of await Promise.all(want)){
    if (!T) continue;
    const [x0, y0] = corner(T.ix, T.iy);
    // inside a building outline wins outright
    for (let k = 0; k < T.p.length; k++){
      const p = T.p[k], plon = x0 + p[1] / 1e6, plat = y0 + p[2] / 1e6;
      let d = Math.hypot((plon - lon) * KX, (plat - lat) * KY);
      if (p[8] >= 0 && inRing(T.b[p[8]][4], (lon - x0) * 1e6, (lat - y0) * 1e6)) d = Math.min(d, 0.5);
      if (d < bd){ bd = d; best = {T, k}; }
    }
  }
  return best;
}
function inRing(f, x, y){ let c = false; for (let i = 0, j = f.length - 2; i < f.length; j = i, i += 2){ const xi = f[i], yi = f[i + 1], xj = f[j], yj = f[j + 1]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
function ringLL(T, f){ const [x0, y0] = corner(T.ix, T.iy), out = []; for (let i = 0; i < f.length; i += 2) out.push([x0 + f[i] / 1e6, y0 + f[i + 1] / 1e6]); return out; }

/* ---------- map ---------- */
let map;
function ownDomain(){ return /(^|\.)(fixchicagohousing\.com|shapechicago\.(com|org)|workers\.dev)$/.test(location.hostname) || /[?&]tiles=1/.test(location.search); }
async function initMap(){
  let style = {version:8, sources:{}, layers:[{id:"bg", type:"background", paint:{"background-color":"#eef0ec"}}]}, credit = "City of Chicago, Cook County Assessor";
  if (ownDomain()){
    try { style = await fetch("https://tiles.openfreemap.org/styles/positron").then(r => r.json()); } catch (e){}
  }
  const phone = matchMedia("(max-width:859px)").matches;
  map = new maplibregl.Map({container:"map", style, center:[-87.68, 41.89], zoom:phone ? 10.2 : 11, minZoom:9, maxZoom:19,
    maxBounds:[[-88.3, 41.5], [-87.2, 42.2]], attributionControl:{compact:true, customAttribution:credit}, dragRotate:false, pitchWithRotate:false, fadeDuration:0});
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.NavigationControl({showCompass:false}), "bottom-right");
  await new Promise(r => map.on("load", r));
  const first = map.getStyle().layers.find(l => l.type === "symbol");
  map.addSource("zones", {type:"geojson", data:{type:"FeatureCollection", features:[]}});
  map.addSource("blds", {type:"geojson", data:{type:"FeatureCollection", features:[]}});
  map.addSource("pick", {type:"geojson", data:{type:"FeatureCollection", features:[]}});
  map.addLayer({id:"zones", type:"fill", source:"zones", minzoom:14, paint:{"fill-color":["get", "c"], "fill-opacity":["interpolate", ["linear"], ["zoom"], 14, 0, 14.6, 0.45, 17, 0.32]}}, first && first.id);
  map.addLayer({id:"zones-line", type:"line", source:"zones", minzoom:14, paint:{"line-color":"#5b6470", "line-width":0.8, "line-opacity":0.55}}, first && first.id);
  map.addLayer({id:"blds", type:"fill", source:"blds", minzoom:15, paint:{"fill-color":"#d9dde2", "fill-outline-color":"#a9b0b8", "fill-opacity":ownDomain() ? 0 : 0.9}}, first && first.id);
  map.addLayer({id:"pick-fill", type:"fill", source:"pick", filter:["==", ["geometry-type"], "Polygon"], paint:{"fill-color":"#2b5da0", "fill-opacity":0.35}});
  map.addLayer({id:"pick-line", type:"line", source:"pick", filter:["==", ["geometry-type"], "Polygon"], paint:{"line-color":"#1d4580", "line-width":2.4}});
  map.addLayer({id:"pick-pt", type:"circle", source:"pick", filter:["==", ["geometry-type"], "Point"], paint:{"circle-radius":7, "circle-color":"#e4002b", "circle-stroke-color":"#fff", "circle-stroke-width":2.5}});
  if (ownDomain() && first) map.addLayer({id:"zone-lbl", type:"symbol", source:"zones", minzoom:15.5, layout:{"text-field":["get", "z"], "text-size":11, "text-font":["Noto Sans Regular"], "symbol-placement":"point"}, paint:{"text-color":"#3d434b", "text-halo-color":"#fff", "text-halo-width":1.4}});
  map.on("moveend", drawZones);
  map.on("click", e => pickAt(e.lngLat.lng, e.lngLat.lat, true));
  map.getCanvas().style.cursor = "pointer";
}
let drawTok = 0;
async function drawZones(){
  if (map.getZoom() < 14){ document.getElementById("zkey").classList.remove("show"); return; }
  const b = map.getBounds(), tok = ++drawTok, list = [];
  const [ix0, iy0] = tkey(b.getWest(), b.getSouth()), [ix1, iy1] = tkey(b.getEast(), b.getNorth());

    if (!navigator.geolocation){ $("hint").textContent = "Your browser can't share a location."; return; }
    $("hint").textContent = "Finding you…";
    navigator.geolocation.getCurrentPosition(p => pickAt(p.coords.longitude, p.coords.latitude, false), () => { $("hint").textContent = "Location is off. Type an address instead."; }, {timeout:10000});
  };
  $("grab").onclick = () => $("panel").classList.toggle("min");
  loadStreets().then(L => { if (!L.length){ $("q").placeholder = "Address search is coming; tap the map"; } });
  const h = location.hash.match(/^#(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (h) pickAt(+h[1], +h[2], false);
})();
</script>
</body>
</html>
