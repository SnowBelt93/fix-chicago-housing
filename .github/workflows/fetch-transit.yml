# Downloads and compacts the transit tool's data (CTA + Metra schedules, Census blocks, jobs, bus ridership)
# into tools/raw/transit/. The cloud workspace can't reach these hosts, so this runs here. Trigger: push to tools/transit/** or by hand.
name: Fetch transit data
on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Steps to run (cta metra blocks bus); blank = all'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['tools/transit/fetch.py', '.github/workflows/fetch-transit.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install pyshp
      - name: Download jobs (LODES, resumable)
        timeout-minutes: 25
        continue-on-error: true
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          case "$MSG" in *"[steps:"*) case "$MSG" in *blocks*) ;; *) echo "jobs not needed for these steps"; exit 0;; esac;; esac
          mkdir -p tools/raw/transit
          for y in 2022 2021 2023; do
            f=tools/raw/transit/il_wac_S000_JT00_$y.csv.gz
            u="https://lehd.ces.census.gov/data/lodes/LODES8/il/wac/il_wac_S000_JT00_$y.csv.gz"
            for i in $(seq 1 60); do
              curl -sS -L --http1.1 -4 --connect-timeout 15 --max-time 90 -C - -A "Mozilla/5.0" -o "$f" "$u" || true
              if gzip -t "$f" 2>/dev/null; then echo "got $y after $i tries ($(stat -c %s "$f") bytes)"; break 2; fi
              echo "try $i: $(stat -c %s "$f" 2>/dev/null || echo 0) bytes"; sleep 3
            done
            [ -s "$f" ] && { echo "keeping partial $y ($(stat -c %s "$f") bytes)"; break; }
          done
          ls -la tools/raw/transit || true
      - name: Download
        # a push can name its steps in the commit message, e.g. "[steps: amtrak nictd]"; otherwise all steps run
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          STEPS="${{ github.event.inputs.steps }}"
          if [ -z "$STEPS" ]; then STEPS=$(printf '%s' "$MSG" | sed -n 's/.*\[steps: *\([a-z ]*\)\].*/\1/p' | head -1); fi
          echo "steps: ${STEPS:-all}"
          python3 tools/transit/fetch.py $STEPS
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/raw/transit
          git commit -m "Fetch transit data" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*10)); done; exit 1
