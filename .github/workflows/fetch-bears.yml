# Downloads for "Where Should the Bears Play?" into tools/raw/bears/ (OpenStreetMap land, hotels, parking, exits,
# reference stadiums; Census blocks + jobs for NW Indiana). Trigger: push to tools/bears/** or by hand.
name: Fetch Bears stadium data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/bears/**', '.github/workflows/fetch-bears.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install pyshp
      - name: Download Indiana jobs (LODES, resumable)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          mkdir -p tools/raw/bears
          for y in 2022 2021; do
            f=tools/raw/bears/in_wac_S000_JT00_$y.csv.gz
            u="https://lehd.ces.census.gov/data/lodes/LODES8/in/wac/in_wac_S000_JT00_$y.csv.gz"
            for i in $(seq 1 40); do
              curl -sS -L --http1.1 -4 --connect-timeout 15 --max-time 90 -C - -A "Mozilla/5.0" -o "$f" "$u" || true
              if gzip -t "$f" 2>/dev/null; then echo "got $y after $i tries"; break 2; fi
              sleep 3
            done
          done
      - name: Download
        timeout-minutes: 95
        continue-on-error: true
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          STEPS=$(printf '%s' "$MSG" | sed -n 's/.*\[steps: *\([a-z ]*\)\].*/\1/p' | head -1)
          python3 tools/bears/fetch.py $STEPS
          ls -la tools/raw/bears
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/raw/bears
          git commit -m "Fetch Bears stadium data" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*10)); done; exit 1
