# Downloads Cook County Assessor parcel locations, lot sizes and apartment counts for Chicago,
# used to check the "illegal to build today" flags (tools/check_illegal.py). Runs on changes to its script or by hand.
name: Fetch parcels
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/fetch_parcels.py', '.github/workflows/fetch-parcels.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: python3 tools/fetch_parcels.py
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/raw/cook_parcels_chi.csv.gz tools/raw/cook_chars_chi.csv.gz tools/raw/cook_chars_columns.json
          git commit -m "Fetch Cook County parcels and characteristics" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*10)); done; exit 1
