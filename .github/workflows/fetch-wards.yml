# Downloads City Clerk records for the ward housing record (tools/wards/fetch.py). Was hourly until the zoning ordinance
# backfill is done; now daily for new matters (each run skips what it already has), on script changes, or by hand.
name: Fetch ward records
on:
  workflow_dispatch:
  schedule:
    - cron: '41 10 * * *'
  push:
    branches: [main]
    paths: ['tools/wards/fetch.py', '.github/workflows/fetch-wards.yml']
permissions:
  contents: write
concurrency: wards
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      # City Clerk texts name private applicants, so they stay out of the repo; caches keep them between runs.
      - uses: actions/cache@v4
        with:
          path: tools/raw/wards/ord
          key: wards-ord-${{ github.run_id }}
          restore-keys: wards-ord-
      - uses: actions/cache/restore@v4
        with:
          path: tools/raw/tracker/elms_text
          key: elms-text-none
          restore-keys: elms-text-
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Download
        run: python3 tools/wards/fetch.py
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/raw/wards
          git commit -m "Ward records $(date -u +%F-%H)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*10)); done; exit 1
      - name: Rebuild the ward pages on the preview branch (shape-v1)
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pip install -q numpy shapely
          mkdir -p /tmp/main && cp -r tools/raw/wards tools/raw/tracker /tmp/main/
          git fetch -q origin shape-v1 && git checkout -q -B shape-v1 origin/shape-v1
          [ -f tools/wards/build.py ] || exit 0
          rm -rf tools/raw/wards && cp -r /tmp/main/wards tools/raw/wards
          mkdir -p tools/raw/tracker && rm -rf tools/raw/tracker/elms_text && cp -r /tmp/main/tracker/elms_text tools/raw/tracker/ && cp /tmp/main/tracker/elms_zoning.json.gz tools/raw/tracker/
          python3 tools/wards/build.py
          git add tools/raw/wards wards/data tools/raw/tracker/elms_zoning.json.gz
          git commit -m "Ward housing records $(date -u +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin shape-v1 && git push origin HEAD:shape-v1 && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*10)); done; exit 1
