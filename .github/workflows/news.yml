# Chicago planning and policy news feed for Shape Chicago (tools/news/fetch.py), every three hours.
name: News feed
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths: ['tools/news/fetch.py', '.github/workflows/news.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: python3 tools/news/fetch.py
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/data
          git commit -m "Update Chicago news feed" || true
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; git rebase --abort 2>/dev/null || true; sleep $((i*10)); done
          # the preview site (shape-v1) shows the same feed
          cp news/data/news.json /tmp/news.json
          git fetch -q origin shape-v1 && git checkout -q -B shape-v1 origin/shape-v1
          mkdir -p news/data && cp /tmp/news.json news/data/news.json
          git add news/data && git commit -m "Update Chicago news feed" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin shape-v1 && git push origin HEAD:shape-v1 && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*10)); done; exit 1
