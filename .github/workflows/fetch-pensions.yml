# Downloads pension data for the Shape Chicago pensions tool (tools/pensions/fetch.py).
name: Fetch pension data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/pensions/fetch.py', '.github/workflows/fetch-pensions.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          sudo apt-get install -y poppler-utils >/dev/null
          python3 tools/pensions/fetch.py
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/raw/pensions
          git commit -m "Fetch pension data" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*10)); done; exit 1
