# One-time: copies the cached City Clerk texts (tools/raw/tracker/elms_text, tools/raw/wards/ord) into the
# Actions cache, so they can leave the repo. Those texts name private applicants and owners.
name: Seed text caches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/seed-cache.yml']
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/save@v4
        with:
          path: tools/raw/tracker/elms_text
          key: elms-text-seed-${{ github.run_id }}
      - uses: actions/cache/save@v4
        with:
          path: tools/raw/wards/ord
          key: wards-ord-seed-${{ github.run_id }}
