# Housing production tracker: downloads Chicago new-construction permits, City Clerk zoning matters and
# Census permit totals, then rebuilds tracker/data.json. Runs daily, on changes to the tracker scripts, or by hand.
name: Tracker data
on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'
  push:
    branches: [main]
    paths: ['tools/tracker/**', '.github/workflows/tracker.yml']
permissions:
  contents: write
concurrency: tracker
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      # City Clerk texts name private applicants, so they stay out of the repo; this cache keeps them between runs.
      - uses: actions/cache@v4
        with:
          path: tools/raw/tracker/elms_text
          key: elms-text-${{ github.run_id }}
          restore-keys: elms-text-
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr >/dev/null
      - name: Download
        run: python3 tools/tracker/fetch.py
      - name: Build
        run: if [ -f tools/tracker/build.py ]; then python3 tools/tracker/build.py; fi
      # homes torn down, from demolition permits matched to the 2013 building footprints (Progress shows permitted minus torn down)
      - name: Teardowns
        run: |
          pip install -q numpy shapely
          if [ -f tools/raw/tracker/permits_wreck.csv.gz ]; then python3 tools/tracker/teardowns.py || echo "teardown count failed; keeping the last one"; fi
      # monthly rides on CTA, Metra and Pace from the federal transit database (Progress → Transit)
      - name: Transit rides
        run: python3 tools/tracker/transit_monthly.py || echo "transit rides failed; keeping the last file"
      # traffic deaths, serious injuries, potholes, camera violations and the city's affordable list (Progress → Streets, Affordable)
      # days from application to permit for new buildings with homes (Progress → Homes, the lot tool)
      - name: Permit timelines
        run: python3 tools/tracker/timelines.py || echo "timelines failed; keeping the last file"
      - name: Streets and affordable list
        run: python3 tools/tracker/streets_daily.py || echo "streets numbers failed; keeping the last files"
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/raw/tracker tracker 2>/dev/null || git add tools/raw/tracker
          git commit -m "Tracker data $(date -u +%F)" || { echo "nothing to commit"; exit 0; }
          # If someone pushed while this ran, replay this run's data on top (its fresh data wins conflicts); retry a few times.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
      # the preview site (shape-v1) shows the same numbers
      - name: Preview site
        run: |
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp tracker/data.json /tmp/tracker.json; cp tracker/teardowns.json /tmp/teardowns.json 2>/dev/null || true; cp tracker/transit.json /tmp/transit.json 2>/dev/null || true
          for f in streets affordable timelines; do cp tracker/$f.json /tmp/$f.json 2>/dev/null || true; done
          git fetch -q origin shape-v1 || exit 0
          git checkout -q -B shape-v1 origin/shape-v1
          cp /tmp/tracker.json tracker/data.json; cp /tmp/teardowns.json tracker/teardowns.json 2>/dev/null || true; cp /tmp/transit.json tracker/transit.json 2>/dev/null || true
          for f in streets affordable timelines; do cp /tmp/$f.json tracker/$f.json 2>/dev/null || true; done
          # the Progress pages are written from the same numbers
          if [ -f tools/progress/build.py ]; then python3 tools/progress/build.py && git add progress && (git add embed press 2>/dev/null || true) || true; fi
          git add tracker/data.json; for f in teardowns transit streets affordable timelines; do git add tracker/$f.json 2>/dev/null || true; done; git commit -m "Tracker data $(date -u +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin shape-v1 && git push origin HEAD:shape-v1 && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*10)); done; exit 1
